name: Build and Deploy to Google Play Store

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Upload to Play Console
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build Release Bundle & APK
        run: |
          STORE_FILE="$(pwd)/app/release.keystore"
          if [ -f "$STORE_FILE" ]; then
            echo "Signing with release.keystore..."
            ./gradlew bundleRelease assembleRelease \
              -Pandroid.injected.signing.store.file="$STORE_FILE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "Building standard bundle and debug apk..."
            ./gradlew bundleRelease assembleDebug
          fi

      - name: Upload Bundle Artifact (AAB for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Upload APK Artifact (Direct Installable APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Setup Google Play Service Account
        if: env.PLAY_STORE_JSON_KEY != ''
        run: |
          echo "$PLAY_STORE_JSON_KEY" > play_service_account.json

      - name: Deploy to Google Play
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play_service_account.json
          packageName: com.study.vocabspecial_crazywaytolearnenglish
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: production
          status: completed
